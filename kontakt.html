<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kontakt – Islamische Gemeinde Bargteheide e.V.</title>
    <meta name="description" content="Kontakt und Anfahrt: Moschee Bargteheide, Rudolf-Diesel-Straße 4, 22941 Bargteheide." />
    <meta name="theme-color" content="#14503f" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body data-page-title-key="nav.contact">
    <a class="skip-link" href="#main" data-i18n="common.skip">Zum Inhalt springen</a>
    <div data-site-header></div>

    <main id="main">
      <section class="page-head">
        <div class="container">
          <h1 data-i18n="contact.title">Kontakt</h1>
          <p data-i18n="contact.intro">Wir freuen uns über Ihre Nachricht und Ihren Besuch.</p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="grid grid--2">
            <div class="card">
              <h2 data-i18n="contact.contactTitle">Kontaktdaten</h2>
              <div data-contact-details></div>
              <p style="margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap">
                <a class="btn btn--primary" data-route-button href="#" hidden>Route starten</a>
                <a class="btn btn--outline" data-mail-button href="#" hidden data-i18n="contact.writeUs">Schreiben Sie uns</a>
              </p>
            </div>
            <div>
              <h2 data-i18n="contact.mapTitle">Karte</h2>
              <div data-map></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div data-site-footer></div>

    <script src="assets/js/site.js"></script>
    <script src="assets/js/pages.js"></script>
  </body>
</html>
