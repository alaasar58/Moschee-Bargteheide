<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="assets/css/style.css" />
    <script>
      // Gespeicherten Farbmodus setzen, bevor die Seite gezeichnet wird.
      try {
        var t = localStorage.getItem("mb-theme");
        document.documentElement.setAttribute("data-theme", t === "dark" || t === "auto" ? t : "light");
      } catch (e) {}
    </script>
  </head>
  <body data-page-title-key="nav.news">

      <section class="page-head" data-news-listhead>

          <h1 data-i18n="news.title">Neuigkeiten</h1>
          <p data-i18n="news.intro">Aktuelles aus der Moschee und der Gemeinde.</p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div data-news="detail"></div>
          <div data-news="list"></div>
        </div>
      </section>
    </main>

    <div data-site-footer></div>

    <script src="assets/js/site.js"></script>
