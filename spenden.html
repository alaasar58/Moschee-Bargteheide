<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spenden – Islamische Gemeinde Bargteheide e.V.</title>
    <meta name="description" content="Die Moschee Bargteheide und die Arbeit der Islamischen Gemeinde Bargteheide e.V. mit einer Spende unterstützen." />
    <meta name="theme-color" content="#e8f4fa" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script>
      // Gespeicherten Farbmodus setzen, bevor die Seite gezeichnet wird.
      try {
        var t = localStorage.getItem("mb-theme");
        document.documentElement.setAttribute("data-theme", t === "dark" || t === "auto" ? t : "light");
      } catch (e) {}
    </script>
  </head>
  <body data-page-title-key="nav.donate">
    <a class="skip-link" href="#main" data-i18n="common.skip">Zum Inhalt springen</a>
    <div data-site-header></div>

    <main id="main">
      <section class="page-head">
        <div class="container">
          <h1 data-i18n="donate.title">Spenden</h1>
          <p data-i18n="donate.intro">Unterstützen Sie die Moschee und die Arbeit der Gemeinde.</p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <p data-i18n="donate.text"></p>

          <h2 data-i18n="donate.methodsTitle">So können Sie spenden</h2>
          <div class="grid grid--2">
            <div class="card">
              <h3 data-i18n="donate.paypal">PayPal</h3>
              <p data-paypal></p>
              <a class="btn btn--primary" data-donation-link href="#" hidden data-i18n="donate.onlineCta">Online spenden</a>
            </div>
            <div class="card">
              <h3 data-i18n="donate.transfer">Überweisung</h3>
              <div data-bank></div>
            </div>
          </div>

          <p style="margin-top: 20px" data-i18n="donate.onSite"></p>

          <p style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap">
            <a class="btn btn--outline" href="kontakt.html" data-i18n="home.ctaContact">Kontakt aufnehmen</a>
          </p>

          <p class="info-box" style="margin-top: 26px" data-i18n="donate.thanks"></p>
        </div>
      </section>
    </main>

    <div data-site-footer></div>

    <script src="assets/js/site.js"></script>
    <script src="assets/js/pages.js"></script>
  </body>
</html>
