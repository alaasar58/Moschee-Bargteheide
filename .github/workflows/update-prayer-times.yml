name: Gebetszeiten aktualisieren

# Holt die Gebetszeiten automatisch von Mawaqit (Islamische Gemeinde Bargteheide, ID 27703)
# und schreibt sie nach data/prayer-times.json. Aenderungen in Mawaqit erscheinen dadurch
# automatisch auf der Website.

on:
  schedule:
    # Taeglich um 02:15 UTC (Mawaqit-Kalender enthaelt das ganze Jahr, ein Lauf pro Tag genuegt).
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prayer-times
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gebetszeiten von Mawaqit holen
        run: node scripts/fetch-mawaqit.mjs

      - name: Aenderungen committen
        run: |
          if [ -z "$(git status --porcelain data/prayer-times.json)" ]; then
            echo "Keine Aenderungen an den Gebetszeiten."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prayer-times.json
          git commit -m "chore: Gebetszeiten von Mawaqit aktualisiert"
          git push
