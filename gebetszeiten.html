<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gebetszeiten – Islamische Gemeinde Bargteheide e.V.</title>
    <meta
      name="description"
      content="Gebetszeiten der Moschee Bargteheide: Fajr, Shurūq, Dhuhr, Asr, Maghrib, Isha, Imsak, Iqāma und Freitagsgebet. Quelle: Mawaqit."
    />
    <meta name="theme-color" content="#e8f4fa" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script>
      // Gespeicherten Farbmodus setzen, bevor die Seite gezeichnet wird.
      try {
        var t = localStorage.getItem("mb-theme");
        document.documentElement.setAttribute("data-theme", t === "dark" || t === "auto" ? t : "light");
      } catch (e) {}
    </script>
  </head>
  <body data-page-title-key="nav.prayer">
    <a class="skip-link" href="#main" data-i18n="common.skip">Zum Inhalt springen</a>
    <div data-site-header></div>

    <main id="main">
      <section class="page-head">
        <div class="container">
          <h1 data-i18n="prayer.title">Gebetszeiten</h1>
          <p data-i18n="prayer.intro">
            Die Gebetszeiten werden automatisch von Mawaqit übernommen und regelmäßig aktualisiert.
          </p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <p class="hijri-line">
            <span data-i18n="prayer.hijriLabel">Islamisches Datum</span>
            <span class="hijri-line__value" data-hijri-date></span>
          </p>
          <div data-prayer="full"></div>
          <p style="margin-top: 20px; font-size: 0.88rem; color: var(--text-soft)" data-i18n="prayer.iqamaNote">
            Iqāma-Zeiten, sofern von der Moschee hinterlegt.
          </p>
        </div>
      </section>

      <section class="section section--alt" id="besondere-tage">
        <div class="container">
          <h2 data-i18n="islamic.title">Besondere Tage im Islam</h2>
          <p data-i18n="islamic.intro"></p>
          <div data-islamic-days></div>
          <p style="margin-top: 18px">
            <a class="btn btn--outline" href="ramadan.html" data-i18n="ramadan.linkCta">Zur Ramadan-Seite</a>
          </p>
        </div>
      </section>
    </main>

    <div data-site-footer></div>

    <script src="assets/js/site.js"></script>
    <script src="assets/js/pages.js"></script>
    <script src="assets/js/prayer.js"></script>
    <script src="assets/js/hijri.js"></script>
