<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weiterleitung – Kostenlose Website für Ihre Moschee</title>

    <!--
      Diese Seite ist umgezogen.

      Das Angebot, Websites für Moscheen zu erstellen, gehört nicht zu einer
      einzelnen Gemeinde: Sobald mehrere Moscheen eine Website haben, ist keine
      davon die zentrale. Es steht deshalb auf der Seite des Erstellers, und
      jede Moschee verweist nur noch dorthin.

      Diese Datei bleibt als Weiterleitung bestehen, damit eine früher geteilte
      Adresse weiterhin funktioniert.
    -->
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=https://alaasar58.github.io/Lynn-portfolio/#mosques" />
    <link rel="canonical" href="https://alaasar58.github.io/Lynn-portfolio/#mosques" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fbfdfd;
        color: #2b4247;
        font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
        line-height: 1.6;
        text-align: center;
      }
      a {
        color: #17706a;
      }
      p {
        margin: 0 0 10px;
      }
      .sub {
        font-size: 0.9rem;
        color: #5f7880;
      }
    </style>
  </head>
  <body>
    <main>
      <p>
        <a href="https://alaasar58.github.io/Lynn-portfolio/#mosques">
          Kostenlose Website für Ihre Moschee – hier weiterlesen
        </a>
      </p>
      <p class="sub" lang="en">If you are not redirected, please use the link above.</p>
    </main>

    <script>
      // Ersetzt den Eintrag im Verlauf, damit "Zurück" nicht wieder hierher führt.
      location.replace("https://alaasar58.github.io/Lynn-portfolio/#mosques");
    </script>
  </body>
</html>
